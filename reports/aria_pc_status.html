<!doctype html>
<html lang="de">

<head>
   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width, initial-scale=1">
   <meta name="theme-color" content="#061922">
   <title>ARIA // START</title>
   <style>
      :root {
         --bg-0: #020913;
         --bg-1: #071d2d;
         --bg-2: #0d2438;
         --panel: rgba(8, 18, 28, 0.9);
         --panel-soft: rgba(15, 29, 42, 0.78);
         --cyan: #9eeeff;
         --cyan-strong: #65d9ff;
         --green: #7ef8d3;
         --silver: #edf6ff;
         --muted: #c9d9e7;
         --shadow: rgba(101, 217, 255, 0.42);
      }

      * {
         box-sizing: border-box;
      }

      body {
         margin: 0;
         min-height: 100vh;
         display: grid;
         place-items: center;
         background:
            radial-gradient(circle at 50% 24%, rgba(145, 224, 255, 0.18), transparent 30%),
            linear-gradient(140deg, var(--bg-0), var(--bg-1) 42%, var(--bg-2) 100%);
         color: var(--silver);
         font: 16px/1.5 "Segoe UI", Arial, sans-serif;
      }

      .frame {
         position: relative;
         width: min(92vw, 500px);
         padding: 22px 20px 20px;
         border-radius: 30px;
         background: linear-gradient(180deg, rgba(9, 22, 34, 0.93), rgba(5, 14, 21, 0.94));
         border: 1px solid rgba(158, 238, 255, 0.28);
         box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.04), 0 0 28px rgba(101, 217, 255, 0.18), 0 22px 42px rgba(0, 0, 0, 0.38);
      }

      .frame::before {
         content: "";
         position: absolute;
         inset: 12px;
         border-radius: 22px;
         border: 1px solid rgba(158, 238, 255, 0.12);
         pointer-events: none;
      }

      .status {
         display: inline-flex;
         align-items: center;
         gap: 10px;
         border-radius: 999px;
         background: rgba(6, 18, 24, 0.9);
         border: 1px solid rgba(158, 238, 255, 0.38);
         color: var(--cyan);
         padding: 8px 14px;
         letter-spacing: 0.18em;
         text-transform: uppercase;
         font-size: 10px;
         font-weight: 800;
      }

      .brand-label {
         margin-top: 18px;
         text-align: center;
         font-size: 0.74rem;
         letter-spacing: 0.22em;
         text-transform: uppercase;
         color: var(--muted);
      }

      .dot {
         width: 10px;
         height: 10px;
         border-radius: 50%;
         background: linear-gradient(180deg, var(--green), #47d9ae);
         box-shadow: 0 0 14px rgba(126, 248, 211, 0.95);
         animation: pulse 1.8s infinite ease-in-out;
      }

      .icon-wrap {
         display: grid;
         place-items: center;
         margin: 18px auto 10px;
         width: 172px;
         height: 172px;
         border-radius: 32px;
         background: linear-gradient(180deg, rgba(158, 238, 255, 0.08), rgba(7, 24, 35, 0.05));
         border: 1px solid rgba(158, 238, 255, 0.22);
         box-shadow: inset 0 0 24px rgba(101, 217, 255, 0.13);
      }

      .icon {
         width: 120px;
         height: 120px;
         display: block;
         filter: drop-shadow(0 0 20px rgba(101, 217, 255, 0.38));
      }

      h1 {
         margin: 0;
         text-align: center;
         font-size: clamp(2.1rem, 9vw, 3.4rem);
         letter-spacing: 0.18em;
         text-transform: uppercase;
      }

      .subtitle {
         text-align: center;
         margin-top: 8px;
         color: var(--muted);
         letter-spacing: 0.28em;
         text-transform: uppercase;
         font-size: 0.72rem;
      }

      .controls {
         margin-top: 22px;
         display: grid;
         grid-template-columns: 1.4fr 1fr 0.8fr;
         gap: 10px;
      }

      button {
         appearance: none;
         border: 1px solid transparent;
         border-radius: 16px;
         padding: 16px 12px;
         font-weight: 800;
         letter-spacing: 0.14em;
         text-transform: uppercase;
         font-size: 0.7rem;
         cursor: pointer;
         transition: transform 0.16s ease, box-shadow 0.16s ease;
      }

      button:hover {
         transform: translateY(-1px);
      }

      button:active {
         transform: translateY(0);
      }

      .primary {
         background: linear-gradient(135deg, #dffcff 0%, #a5eeff 22%, #6fe0ff 45%, #3eaef3 100%);
         color: #041b2f;
         box-shadow: 0 14px 28px rgba(101, 217, 255, 0.35), inset 0 2px 0 rgba(255, 255, 255, 0.8);
      }

      .secondary {
         background: rgba(10, 22, 34, 0.9);
         border-color: rgba(158, 238, 255, 0.38);
         color: var(--silver);
      }

      .ghost {
         background: rgba(13, 27, 38, 0.8);
         border-color: rgba(126, 248, 211, 0.36);
         color: var(--muted);
      }

      .meta {
         margin-top: 18px;
         display: flex;
         justify-content: center;
      }

      .meta-badge {
         display: inline-flex;
         align-items: center;
         border-radius: 999px;
         padding: 8px 14px;
         border: 1px solid rgba(126, 248, 211, 0.24);
         background: rgba(7, 19, 26, 0.75);
         color: var(--muted);
         font-size: 0.7rem;
         letter-spacing: 0.18em;
         text-transform: uppercase;
      }

      .hint {
         margin-top: 16px;
         text-align: center;
         color: var(--muted);
         line-height: 1.65;
         font-size: 0.78rem;
      }

      @keyframes pulse {

         0%,
         100% {
            opacity: 1;
            transform: scale(1);
         }

         50% {
            opacity: 0.68;
            transform: scale(1.2);
         }
      }

      @media (max-width: 420px) {
         .controls {
            grid-template-columns: 1fr;
         }

         .frame {
            padding: 18px 14px;
         }
      }
   </style>
</head>

<body>
   <main class="frame">
      <div class="status"><span class="dot"></span> Aria // online</div>
      <div class="brand-label">Aria PC Completion Status</div>

      <div class="icon-wrap">
         <img class="icon" src="Aria_Icon_Cyberpunk_Metallic.svg" alt="ARIA icon" />
      </div>

      <h1>ARIA</h1>
      <div class="subtitle">Guts &amp; Gigaflopps</div>

      <div class="controls">
         <button class="primary" onclick="runLaunch('start_master.ps1')">ARIA START</button>
         <button class="secondary" onclick="runLaunch('Start-Phoenix.ps1')">PHOENIX</button>
         <button class="ghost" onclick="runLaunch('safe_mode.ps1')">SAFE</button>
      </div>

      <div class="meta"><span class="meta-badge">SYSTEM READY</span></div>

      <div class="hint">
         Windows Desktop: direkt starten oder als Shortcut sichern.<br>
         Smartphone: als Home-Screen-Symbol im Browser speichern.
      </div>
   </main>

   <script>
      function runLaunch(file) {
         const ua = navigator.userAgent || '';
         if (/Windows/i.test(ua)) {
            window.location.href = file;
         } else {
            alert('Windows-optimiert. Auf dem Smartphone als Lesezeichen oder Home-Screen-Symbol speichern.');
         }
      }
   </script>
</body>

</html>
